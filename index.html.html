<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAD5 Berlinas · Dashboard Operativo, Flota & Variable JEO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;

      // ======================================================================
      // CONEXIÓN REALTIME DATABASE · PROYECTO SITE-BERLINAS
      // ======================================================================
      const firebaseConfig = {
        apiKey: "AIzaSyBZ3_Rh7nfv7qWVpD7-Law7pESj-om3wbs",
        authDomain: "site-berlinas.firebaseapp.com",
        databaseURL: "https://site-berlinas-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "site-berlinas",
        storageBucket: "site-berlinas.firebasestorage.app",
        messagingSenderId: "1087232103977",
        appId: "1:1087232103977:web:db9d49b2cad83370d42e38",
        measurementId: "G-XM6BM2BC89"
      };

      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      const rtdb = firebase.database();
      const ROOM_REF = rtdb.ref("mad5_berlinas_flota_v1");
      const COORDINATORS = ["Andersson", "Samantha", "Oscar"];

      // ======================================================================
      // UTILIDADES DE PARSEO Y CÁLCULO DE VARIABLE TO BE (4 BLOQUES DEL 25%)
      // ======================================================================
      const parseNum = (val) => {
        if (typeof val === "number") return val;
        if (!val) return 0;
        const cleaned = String(val)
          .replace(/[€%\s]/g, "")
          .replace(/\./g, "")
          .replace(",", ".");
        const num = parseFloat(cleaned);
        return isNaN(num) ? 0 : num;
      };

      const formatEuro = (num) =>
        new Intl.NumberFormat("es-ES", {
          style: "currency",
          currency: "EUR",
          minimumFractionDigits: 2,
        }).format(num || 0);

      const formatPct = (num) => `${(num || 0).toFixed(1).replace(".", ",")} %`;

      function calculateVariableMetrics(drivers, selectedCoordinator, isJanuaryRule) {
        const minWeeksForDoubleAction = isJanuaryRule ? 3 : 4;

        // Bloque 1 (Compartido - 25%): Acciones reales en Urgente + Actuar
        const urgentOrActuar = drivers.filter((d) => ["Urgente", "Actuar"].includes(d.segment));
        const coveredUrgentOrActuar = urgentOrActuar.filter((d) => {
          const requiredActions = (d.weeksInUrgentOrActuar || 1) >= minWeeksForDoubleAction ? 2 : 1;
          return (d.actionsCount || 0) >= requiredActions;
        });

        const block1Ratio = urgentOrActuar.length > 0 ? (coveredUrgentOrActuar.length / urgentOrActuar.length) * 100 : 0;
        let block1Score = 0;
        if (block1Ratio >= 90) block1Score = 100;
        else if (block1Ratio >= 60) block1Score = block1Ratio;

        // Bloque 2 (Compartido - 25%): Cumplimiento de horas efectivas (>80% cuadrante)
        const effectiveDrivers = drivers.filter((d) => (d.cuadrantePct || 0) > 80);
        const block2Ratio = drivers.length > 0 ? (effectiveDrivers.length / drivers.length) * 100 : 0;
        let block2Score = 0;
        if (block2Ratio >= 95) block2Score = 100;
        else if (block2Ratio >= 85) block2Score = block2Ratio;

        // Cartera Individual (Bloques 3 y 4)
        const portfolio =
          selectedCoordinator === "Equipo"
            ? drivers.filter((d) => d.coordinator && d.coordinator !== "Sin asignar")
            : drivers.filter((d) => d.coordinator === selectedCoordinator);

        const portfolioUrgentActuar = portfolio.filter((d) => ["Urgente", "Actuar"].includes(d.segment));
        const portfolioOkExtra = portfolio.filter((d) => ["OK", "Extraperformance"].includes(d.segment));

        // Bloque 3 (Individual - 25%): % DRs en Urgente + Actuar sobre cartera (menor es mejor)
        const block3Ratio = portfolio.length > 0 ? (portfolioUrgentActuar.length / portfolio.length) * 100 : 0;
        let block3Score = 0;
        if (portfolio.length > 0) {
          if (block3Ratio <= 45) block3Score = 100;
          else if (block3Ratio <= 55) block3Score = ((55 - block3Ratio) / (55 - 45)) * 100;
        }

        // Bloque 4 (Individual - 25%): % DRs en OK + Extraperformance sobre cartera (mayor es mejor)
        const block4Ratio = portfolio.length > 0 ? (portfolioOkExtra.length / portfolio.length) * 100 : 0;
        let block4Score = 0;
        if (portfolio.length > 0) {
          if (block4Ratio >= 40) block4Score = 100;
          else if (block4Ratio > 20) block4Score = ((block4Ratio - 20) / (40 - 20)) * 100;
        }

        const totalVariablePct =
          block1Score * 0.25 + block2Score * 0.25 + block3Score * 0.25 + block4Score * 0.25;

        return {
          totalVariablePct,
          block1: { ratio: block1Ratio, score: block1Score, total: urgentOrActuar.length, covered: coveredUrgentOrActuar.length },
          block2: { ratio: block2Ratio, score: block2Score, total: drivers.length, covered: effectiveDrivers.length },
          block3: { ratio: block3Ratio, score: block3Score, count: portfolioUrgentActuar.length, portfolioSize: portfolio.length },
          block4: { ratio: block4Ratio, score: block4Score, count: portfolioOkExtra.length, portfolioSize: portfolio.length },
        };
      }

      // ======================================================================
      // COMPONENTE PRINCIPAL DEL DASHBOARD
      // ======================================================================
      function App() {
        const [activeTab, setActiveTab] = useState("conductores");
        const [selectedCoordinator, setSelectedCoordinator] = useState("Equipo");
        const [selectedWeek, setSelectedWeek] = useState("2026-W48");
        const [isJanuaryRule, setIsJanuaryRule] = useState(false);
        const [cloudStatus, setCloudStatus] = useState("connecting");

        // Base de datos sincronizada (arranca vacía a 0)
        const [drivers, setDrivers] = useState([]);
        const [vehicles, setVehicles] = useState([]);
        const [workshopRecords, setWorkshopRecords] = useState([]);

        // Filtros y Modales
        const [searchQuery, setSearchQuery] = useState("");
        const [segmentFilter, setSegmentFilter] = useState("Todos");
        const [selectedRoiDriver, setSelectedRoiDriver] = useState(null);
        const [soloFilterMode, setSoloFilterMode] = useState("solo");
        const [selectedShifts, setSelectedShifts] = useState([]);
        const [rankingSortBy, setRankingSortBy] = useState("facturacion");
        const [importModalType, setImportModalType] = useState(null);
        const [pasteText, setPasteText] = useState("");

        const [newWorkshop, setNewWorkshop] = useState({
          plate: "",
          driverName: "",
          reason: "Avería mecánica",
          entryDate: new Date().toISOString().split("T")[0],
          entryKm: "",
        });

        // Escucha en tiempo real desde Firebase Realtime Database
        useEffect(() => {
          const connectedRef = rtdb.ref(".info/connected");
          connectedRef.on("value", (snap) => {
            setCloudStatus(snap.val() === true ? "connected" : "connecting");
          });

          const handleData = (snapshot) => {
            const val = snapshot.val() || {};
            setDrivers(Array.isArray(val.drivers) ? val.drivers : Object.values(val.drivers || {}));
            setVehicles(Array.isArray(val.vehicles) ? val.vehicles : Object.values(val.vehicles || {}));
            setWorkshopRecords(
              Array.isArray(val.workshopRecords) ? val.workshopRecords : Object.values(val.workshopRecords || {})
            );
          };

          ROOM_REF.on("value", handleData);
          return () => {
            ROOM_REF.off("value", handleData);
            connectedRef.off();
          };
        }, []);

        const persistState = (nextDrivers, nextVehicles, nextWorkshop) => {
          setDrivers(nextDrivers);
          setVehicles(nextVehicles);
          setWorkshopRecords(nextWorkshop);
          ROOM_REF.set({
            drivers: nextDrivers,
            vehicles: nextVehicles,
            workshopRecords: nextWorkshop,
            updatedAt: Date.now(),
          });
        };

        // Cruce Conductor + Matrícula + Coste semanal
        const enrichedDrivers = useMemo(() => {
          const vehicleByDriver = new Map();
          const vehicleByPlate = new Map();
          vehicles.forEach((v) => {
            if (v.driverCode) vehicleByDriver.set(v.driverCode.trim().toUpperCase(), v);
            if (v.plate) vehicleByPlate.set(v.plate.trim().toUpperCase(), v);
          });

          return drivers.map((d) => {
            const codeKey = (d.code || "").trim().toUpperCase();
            const plateKey = (d.plate || "").trim().toUpperCase();
            const matched = vehicleByDriver.get(codeKey) || vehicleByPlate.get(plateKey) || null;
            return {
              ...d,
              plate: d.plate || matched?.plate || "Sin matrícula",
              vehicleModel: matched?.model || d.vehicleModel || "",
              vehicleWeeklyCost: d.vehicleWeeklyCost ?? matched?.weeklyCost ?? 0,
            };
          });
        }, [drivers, vehicles]);

        const availableShifts = useMemo(() => {
          const set = new Set(enrichedDrivers.map((d) => d.plantilla || d.turno).filter(Boolean));
          return Array.from(set).sort();
        }, [enrichedDrivers]);

        useEffect(() => {
          if (availableShifts.length > 0 && selectedShifts.length === 0) {
            setSelectedShifts(availableShifts);
          }
        }, [availableShifts]);

        const varMetrics = useMemo(
          () => calculateVariableMetrics(enrichedDrivers, selectedCoordinator, isJanuaryRule),
          [enrichedDrivers, selectedCoordinator, isJanuaryRule]
        );

        // Consejos tácticos automáticos
        const tacticalAdvice = useMemo(() => {
          if (enrichedDrivers.length === 0) return [];
          const tips = [];

          if (varMetrics.block1.ratio < 90 && varMetrics.block1.total > 0) {
            const needed = Math.ceil(varMetrics.block1.total * 0.9) - varMetrics.block1.covered;
            tips.push({
              title: `Bloque 1 (Compartido): Faltan ${needed} acciones para desbloquear el 100%`,
              detail: `Estáis al ${varMetrics.block1.ratio.toFixed(1)}% de cobertura en Urgente + Actuar. Al llegar al 90% aseguráis el 25% completo.`,
            });
          }

          const near80 = enrichedDrivers.filter((d) => d.cuadrantePct >= 72 && d.cuadrantePct <= 80);
          if (near80.length > 0) {
            tips.push({
              title: `Bloque 2 (Horas efectivas): ${near80.length} conductores cerca del 80%`,
              detail: `Priorizar seguimiento de conexión en: ${near80
                .slice(0, 4)
                .map((d) => `${d.name} (${d.cuadrantePct}%)`)
                .join(", ")}.`,
            });
          }

          const expensiveSolo = enrichedDrivers.filter(
            (d) =>
              (d.coche || "").toLowerCase().includes("solo") &&
              d.vehicleWeeklyCost >= 150 &&
              d.facturacion < 850
          );
          if (expensiveSolo.length > 0) {
            tips.push({
              title: `Optimización Flota: ${expensiveSolo.length} coches caros en Coche Solo con baja facturación`,
              detail: `Valorar doblar turno o cambiar a vehículo económico a: ${expensiveSolo
                .slice(0, 3)
                .map((d) => `${d.name} (${d.plate} · Coste ${formatEuro(d.vehicleWeeklyCost)}/sem)`)
                .join(" | ")}.`,
            });
          }

          const zeroCash = enrichedDrivers.filter((d) => d.facturacion > 300 && d.cashPct === 0);
          if (zeroCash.length > 0) {
            tips.push({
              title: `Fuga Cash% (0,0%): ${zeroCash.length} conductores sin cobros en efectivo`,
              detail: `Revisar si tienen el efectivo bloqueado en app: ${zeroCash
                .slice(0, 4)
                .map((d) => `${d.name} (${d.code})`)
                .join(", ")}.`,
            });
          }

          return tips;
        }, [enrichedDrivers, varMetrics]);

        // Procesamiento de carga CSV / Pegado
        const handleProcessImport = () => {
          if (!pasteText.trim()) return;
          const lines = pasteText.trim().split(/\r?\n/).filter((l) => l.trim());
          if (lines.length < 2) return;

          const sep = lines[0].includes("\t") ? "\t" : lines[0].includes(";") ? ";" : ",";
          const headers = lines[0].split(sep).map((h) => h.trim().toLowerCase());

          if (importModalType === "drivers") {
            const parsedDrivers = lines.slice(1).map((line, idx) => {
              const cols = line.split(sep).map((c) => c.trim());
              const getCol = (keywords) => {
                const index = headers.findIndex((h) => keywords.some((k) => h.includes(k)));
                return index >= 0 ? cols[index] : "";
              };

              const name = getCol(["conductor", "nombre", "driver"]) || `Conductor ${idx + 1}`;
              const code = getCol(["codigo", "código", "id", "no"]) || `E000${idx + 1}`;
              const plate = getCol(["matricula", "matrícula", "plate"]);
              const segment = getCol(["segmento"]) || "Sin segmentar";
              const rating = parseNum(getCol(["valoracion", "valoración", "rating"]));
              const plantilla = getCol(["plantilla", "horario"]);
              const turno = getCol(["turno"]);
              const coche = getCol(["coche", "modalidad", "doblado"]) || "Coche solo";
              const eurPerHour = parseNum(getCol(["€/h", "eur/h", "rev"]));
              const facturacion = parseNum(getCol(["facturacion", "facturación"]));
              const cForzosaPct = parseNum(getCol(["forzosa"]));
              const arPct = parseNum(getCol(["ar%"]));
              const cashPct = parseNum(getCol(["cash"]));
              const cuadrantePct = parseNum(getCol(["cuadrante"]));
              const horasConexion = parseNum(getCol(["conexion", "conexión"]));
              const jornadaEfectiva = parseNum(getCol(["efectiva"]));
              const ausencias = parseNum(getCol(["ausencias"]));
              const roi = parseNum(getCol(["roi"]));
              const coordinator = getCol(["jeo", "coordinador"]) || "Sin asignar";

              return {
                id: `${code}-${idx}`,
                name,
                code,
                plate,
                segment,
                rating,
                plantilla,
                turno,
                coche,
                eurPerHour,
                facturacion,
                cForzosaPct,
                arPct,
                cashPct,
                cuadrantePct,
                horasConexion,
                jornadaEfectiva,
                ausencias,
                roi,
                coordinator,
                actionsCount: coordinator !== "Sin asignar" ? 1 : 0,
                weeksInUrgentOrActuar: 1,
              };
            });

            persistState(parsedDrivers, vehicles, workshopRecords);
          } else if (importModalType === "vehicles") {
            const parsedVehicles = lines.slice(1).map((line) => {
              const cols = line.split(sep).map((c) => c.trim());
              const getCol = (keywords) => {
                const index = headers.findIndex((h) => keywords.some((k) => h.includes(k)));
                return index >= 0 ? cols[index] : "";
              };

              return {
                plate: getCol(["matricula", "matrícula", "plate"]).toUpperCase(),
                model: getCol(["modelo", "vehiculo", "vehículo", "coche"]),
                weeklyCost: parseNum(getCol(["coste", "costo", "precio", "semanal"])),
                driverCode: getCol(["codigo", "código", "conductor", "id"]).toUpperCase(),
              };
            });

            persistState(drivers, parsedVehicles, workshopRecords);
          }

          setPasteText("");
          setImportModalType(null);
        };

        const handleFileUpload = (e, type) => {
          const file = e.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (evt) => {
            const text = evt.target?.result;
            if (typeof text === "string") {
              if (file.name.endsWith(".json")) {
                try {
                  const data = JSON.parse(text);
                  persistState(data.drivers || [], data.vehicles || [], data.workshopRecords || []);
                } catch {
                  alert("Archivo JSON no válido");
                }
              } else {
                setImportModalType(type);
                setPasteText(text);
              }
            }
          };
          reader.readAsText(file);
          e.target.value = "";
        };

        const handleExportJSON = () => {
          const blob = new Blob(
            [JSON.stringify({ week: selectedWeek, drivers, vehicles, workshopRecords }, null, 2)],
            { type: "application/json" }
          );
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `MAD5_Berlinas_${selectedWeek}.json`;
          a.click();
        };

        const updateDriverField = (driverId, field, value) => {
          const updated = drivers.map((d) => {
            if (d.id !== driverId) return d;
            const next = { ...d, [field]: value };
            if (field === "coordinator") {
              next.actionsCount = value !== "Sin asignar" ? Math.max(1, d.actionsCount || 1) : 0;
            }
            return next;
          });
          persistState(updated, vehicles, workshopRecords);
        };

        const handleAddWorkshop = (e) => {
          e.preventDefault();
          if (!newWorkshop.plate.trim()) return;
          const entry = {
            id: Date.now().toString(),
            ...newWorkshop,
            plate: newWorkshop.plate.toUpperCase().trim(),
            status: "En taller",
            exitDate: null,
          };
          persistState(drivers, vehicles, [entry, ...workshopRecords]);
          setNewWorkshop({
            plate: "",
            driverName: "",
            reason: "Avería mecánica",
            entryDate: new Date().toISOString().split("T")[0],
            entryKm: "",
          });
        };

        const handleReleaseWorkshop = (id) => {
          const updated = workshopRecords.map((r) =>
            r.id === id ? { ...r, status: "Liberado", exitDate: new Date().toISOString().split("T")[0] } : r
          );
          persistState(drivers, vehicles, updated);
        };

        const workshopStats = useMemo(() => {
          const active = workshopRecords.filter((r) => r.status === "En taller");
          const daysList = workshopRecords.map((r) => {
            const start = new Date(r.entryDate);
            const end = r.exitDate ? new Date(r.exitDate) : new Date();
            return Math.max(1, Math.round((end - start) / (1000 * 60 * 60 * 24)));
          });
          const avgDays = daysList.length > 0 ? daysList.reduce((a, b) => a + b, 0) / daysList.length : 0;
          const countMap = {};
          workshopRecords.forEach((r) => {
            const key = `${r.plate}::${r.reason}`;
            countMap[key] = (countMap[key] || 0) + 1;
          });
          const repeatCount = Object.values(countMap).filter((c) => c > 1).length;
          return { activeCount: active.length, avgDays, repeatCount, countMap };
        }, [workshopRecords]);

        const filteredDrivers = useMemo(() => {
          return enrichedDrivers.filter((d) => {
            const q = searchQuery.toLowerCase();
            const matchesSearch =
              !q ||
              d.name.toLowerCase().includes(q) ||
              d.code.toLowerCase().includes(q) ||
              d.plate.toLowerCase().includes(q);
            const matchesSegment = segmentFilter === "Todos" || d.segment === segmentFilter;
            const matchesCoord = selectedCoordinator === "Equipo" || d.coordinator === selectedCoordinator;
            return matchesSearch && matchesSegment && matchesCoord;
          });
        }, [enrichedDrivers, searchQuery, segmentFilter, selectedCoordinator]);

        const rankingDrivers = useMemo(() => {
          return enrichedDrivers
            .filter((d) => {
              const isSolo = (d.coche || "").toLowerCase().includes("solo");
              if (soloFilterMode === "solo" && !isSolo) return false;
              if (soloFilterMode === "doblado" && isSolo) return false;
              const shiftKey = d.plantilla || d.turno;
              if (availableShifts.length > 0 && shiftKey && !selectedShifts.includes(shiftKey)) return false;
              return true;
            })
            .sort((a, b) =>
              rankingSortBy === "facturacion"
                ? (b.facturacion || 0) - (a.facturacion || 0)
                : (b.eurPerHour || 0) - (a.eurPerHour || 0)
            );
        }, [enrichedDrivers, soloFilterMode, selectedShifts, availableShifts, rankingSortBy]);

        const rankingKpis = useMemo(() => {
          const count = rankingDrivers.length;
          const totalFact = rankingDrivers.reduce((sum, d) => sum + (d.facturacion || 0), 0);
          const avgFact = count > 0 ? totalFact / count : 0;
          const avgEurH =
            count > 0 ? rankingDrivers.reduce((sum, d) => sum + (d.eurPerHour || 0), 0) / count : 0;
          return { count, totalFact, avgFact, avgEurH };
        }, [rankingDrivers]);

        return (
          <div className="min-h-screen bg-slate-50 text-slate-800">
            {/* CABECERA */}
            <header className="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30">
              <div className="max-w-[1600px] mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
                <div className="flex items-center gap-3">
                  <span className="bg-fuchsia-600 text-white font-black tracking-wider px-3 py-1 rounded-md text-sm">
                    MAD5 BERLINAS
                  </span>
                  <div>
                    <h1 className="font-bold text-base leading-tight">
                      Dashboard Operativo, Flota & Variable JEO
                    </h1>
                    <p className="text-xs text-slate-400">
                      Sincronización en Tiempo Real · Andersson · Samantha · Oscar
                    </p>
                  </div>
                </div>

                <div className="flex flex-wrap items-center gap-2">
                  <div
                    className={`flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold ${
                      cloudStatus === "connected"
                        ? "bg-emerald-500/20 text-emerald-300 border border-emerald-500/40"
                        : "bg-amber-500/20 text-amber-300 border border-amber-500/40"
                    }`}
                  >
                    <span
                      className={`w-2 h-2 rounded-full ${
                        cloudStatus === "connected" ? "bg-emerald-400 animate-pulse" : "bg-amber-400"
                      }`}
                    ></span>
                    <span>
                      {cloudStatus === "connected" ? "Nube Activa (3 JEOs)" : "Conectando Firebase..."}
                    </span>
                  </div>

                  <select
                    value={selectedWeek}
                    onChange={(e) => setSelectedWeek(e.target.value)}
                    className="bg-slate-800 border border-slate-700 text-white text-xs rounded-lg px-2.5 py-1.5"
                  >
                    <option value="2026-W47">2026-W47 (16-22 nov)</option>
                    <option value="2026-W48">2026-W48 (23-29 nov)</option>
                    <option value="2026-W49">2026-W49 (30 nov-06 dic)</option>
                    <option value="2026-W50">2026-W50 (07-13 dic)</option>
                  </select>

                  <div className="flex items-center gap-1.5 bg-indigo-600/30 border border-indigo-400/40 rounded-lg px-2.5 py-1">
                    <span className="text-xs text-indigo-200 font-medium">JEO:</span>
                    <select
                      value={selectedCoordinator}
                      onChange={(e) => setSelectedCoordinator(e.target.value)}
                      className="bg-transparent text-white font-bold text-xs focus:outline-none cursor-pointer"
                    >
                      <option value="Equipo" className="text-slate-900">Vista Equipo (Todos)</option>
                      {COORDINATORS.map((c) => (
                        <option key={c} value={c} className="text-slate-900">{c}</option>
                      ))}
                    </select>
                  </div>
                </div>
              </div>

              {/* BARRA NAVEGACIÓN Y CARGA */}
              <div className="bg-slate-950/60 border-t border-slate-800/80">
                <div className="max-w-[1600px] mx-auto px-4 py-2 flex flex-wrap items-center justify-between gap-2">
                  <nav className="flex flex-wrap items-center gap-1.5">
                    <button
                      onClick={() => setActiveTab("conductores")}
                      className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                        activeTab === "conductores" ? "bg-indigo-600 text-white" : "text-slate-300 hover:bg-slate-800"
                      }`}
                    >
                      1. Rendimiento & Perfiles ({enrichedDrivers.length})
                    </button>
                    <button
                      onClick={() => setActiveTab("variable")}

            {selectedRoiDriver && (

                <div className="bg-white rounded-2xl max-w-sm w-full p-5 space-y-3">
                  <div className="flex justify-between items-center border-b pb-2">
                    <h4 className="font-bold text-sm">Desglose ROI Semanal</h4>
                    <button onClick={() => setSelectedRoiDriver(null)}>✕</button>
                  </div>
                  <p className="text-xs text-slate-500">
                    {selectedRoiDriver.name} · {selectedRoiDriver.code} · {selectedRoiDriver.plate}
                  </p>
                  <div className="flex justify-between text-sm font-bold">
                    <span>Facturación</span>
                    <span className="text-emerald-600">+{formatEuro(selectedRoiDriver.facturacion)}</span>
                  </div>
                  <div className="flex justify-between text-xs text-slate-600">
                    <span>Coste Vehículo Semanal</span>
                    <span>-{formatEuro(selectedRoiDriver.vehicleWeeklyCost)}</span>
                  </div>
                  <div className="flex justify-between text-sm font-black border-t pt-2">
                    <span>Total ROI</span>
                    <span>{formatEuro(selectedRoiDriver.roi)}</span>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
